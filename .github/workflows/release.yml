# Publish a release when a version tag is pushed.
#
# Obsidian requires the tag to equal manifest.json's version exactly, and
# the three files to be attached individually rather than as a zip. Both
# are easy to get wrong by hand — the first release of this plugin went out
# unnamed, which the community directory flagged — so the checks below fail
# the run rather than publishing something that will be rejected later.

name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write      # create the release
  id-token: write      # sign the provenance attestation
  attestations: write  # record it against the repository

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(jq -r '.version' manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match manifest.json version '$version'. Obsidian requires them to be identical."
            exit 1
          fi
          echo "Tag and manifest agree on $tag."

      - name: Check versions.json records this release
        run: |
          tag="${GITHUB_REF_NAME}"
          min="$(jq -r '.minAppVersion' manifest.json)"
          recorded="$(jq -r --arg t "$tag" '.[$t] // ""' versions.json)"
          if [ "$recorded" != "$min" ]; then
            echo "::error::versions.json must map \"$tag\" to \"$min\"; found '${recorded:-nothing}'. Obsidian uses this to offer the right version to older apps."
            exit 1
          fi
          echo "versions.json maps $tag to Obsidian $min."

      - name: Check the plugin files are present
        run: |
          for f in main.js manifest.json styles.css; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty."
              exit 1
            fi
          done
          ls -l main.js manifest.json styles.css

      # Answers the directory's "missing artifact attestations" finding:
      # proves these exact bytes were produced by this workflow from this
      # commit, so anyone can verify a download with `gh attestation verify`.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            main.js manifest.json styles.css
